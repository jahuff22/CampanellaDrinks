<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Cocktail Match | PROOF</title>
  <meta name="description" content="Answer six quick questions and discover personalized cocktail recommendations matched to your individual tastes and preferences.">
  <link rel="canonical" href="https://joinproof.bar/customer">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PROOF">
  <meta property="og:title" content="Find Your Cocktail Match | PROOF">
  <meta property="og:description" content="Answer six quick questions and discover cocktails matched to your individual tastes and preferences.">
  <meta property="og:url" content="https://joinproof.bar/customer">
  <link rel="stylesheet" href="/style-lounge.css?v=4">
</head>

<body>
  <main id="quiz-screen">
    <h1>PROOF.</h1>

    <form id="quiz-form">
      <div id="slider-container"></div>

      <div class="qualitative-section">
        <label for="qualitative-input">
          Optional: Anything you love or hate
        </label>
        <textarea id="qualitative-input" rows="4"></textarea>
      </div>

      <button type="submit">Recommend Drinks</button>
    </form>
  </main>

  <main id="results-screen" hidden>
    <section id="persona-profile" class="persona-profile"></section>
    <div id="ai-notice" class="ai-notice" hidden></div>
    <section class="recommendations-section">
      <div class="recommendations-heading">
        <h2>Your Matches</h2>
        <button id="retake-button" class="secondary-button" type="button">Retake</button>
      </div>
      <div id="results"></div>
    </section>
  </main>

  <script src="/custom-cocktails.js?v=1"></script>
  <script src="/drinks.js?v=3"></script>
  <script src="/questions.js?v=1"></script>
  <script src="/script.js?v=4"></script>
</body>
</html>
