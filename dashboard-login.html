<!DOCTYPE html>
<html data-brand-page="dashboard">
<head>
  <title>PROOF Dashboard Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dashboard.css?v=5">
  <link rel="stylesheet" href="/shared/brand.css?v=2">
  <link rel="icon" href="/favicon.ico?v=1" sizes="any">
  <link rel="icon" href="/shared/brand/web/favicon-32.png?v=1" type="image/png" sizes="32x32">
  <link rel="icon" href="/shared/brand/web/favicon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/shared/brand/web/apple-touch-icon.png?v=1" sizes="180x180">
  <meta name="theme-color" content="#19102c">
</head>
<body>
  <main class="dashboard-login-shell">
    <section class="dashboard-login-panel">
      <a class="brand brand-lockup" href="/"><img class="proof-logo" src="/shared/brand/web/proof-horizontal.svg" alt="PROOF." width="480" height="124"></a>
      <p class="kicker">Dashboard Access</p>
      <h1 id="login-restaurant-title">Restaurant Console</h1>
      <form id="dashboard-login-form" class="dashboard-login-form">
        <label>
          Password
          <input id="dashboard-password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
      </form>
      <p id="dashboard-login-status" class="dashboard-login-status" hidden></p>
    </section>
  </main>
  <script src="/dashboard-login.js?v=2"></script>
</body>
</html>
